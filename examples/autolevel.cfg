# EH3D-AUTOLEVEL settings
# decimals of X, Y and Z in the levelled program (1 to 6)
decimals = 3
# the most lines the levelled program may have (1 to 100000000)
max-lines = 5000000
# warn when the correction of Z passes this many mm up or down (0.001 to 100, 0 for no warning)
warn-shift-mm = 0
# Z correction for the turn of axis A: off (nothing changes) or tilt (adds radius * (1 - cos A) to Z)
a-axis-compensation = off
# distance in mm from the axis A to the point that is cut, used by tilt (-1000 to 1000, not 0 for tilt)
a-axis-radius-mm = 0
