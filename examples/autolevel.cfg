# EH3D-AUTOLEVEL settings
# decimals of X, Y and Z in the levelled program (1 to 6)
decimals = 3
# the most lines the levelled program may have (1 to 100000000)
max-lines = 5000000
# warn when the correction of Z passes this many mm up or down (0.001 to 100, 0 for no warning)
warn-shift-mm = 0
# Z correction for the turn of axis A: off (nothing changes) or tilt (adds radius * (1 - cos A) to Z)
a-axis-compensation = off
# distance in mm from the axis A to the point that is cut, used by tilt (-1000 to 1000, not 0 for tilt)
a-axis-radius-mm = 0
# Z correction for the turn of axis B (a turn about Y): off or tilt, the same as for A; the axis C turns about Z and needs none
b-axis-compensation = off
# distance in mm from the axis B to the point that is cut, used by tilt (-1000 to 1000, not 0 for tilt)
b-axis-radius-mm = 0
# a move that leaves out X, Y or Z before the program has set it: assume-zero (the program starts at 0) or refuse (the program is refused with the number of the line)
unknown-axis = assume-zero
# show a point of the map that reads this many mm above or below what its neighbours give, as a doubtful reading (0 to 10, 0 for no check)
spike-mm = 0.1
# an arc (G2, G3): refuse (the program is refused with the number of the line) or cut (cut in straight pieces that follow the table)
arcs = refuse
# the most that an arc may stray from its straight pieces, in mm (0.001 to 1); a piece is never longer than the segment either
arc-tolerance-mm = 0.01
# the streaming emitter stops when a corrected Z would go below this many mm (-1000 to 0)
stream-min-z-mm = -10
# it stops when the correction of Z passes this many mm either way (0 for no limit, otherwise 0.001 to 100)
stream-max-shift-mm = 2
# it stops when a move goes more than this many mm outside the measured area (0 to 100)
stream-outside-mm = 0
# the Z the tool is lifted to when the stream stops, before the correction (0 to 1000)
stream-safe-z-mm = 5
